# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release version to GitHub

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version (e.g. v2.2.1)"
                required: true
                type: string

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Validate and parse version
              id: ver
              shell: bash
              run: |
                  set -euo pipefail

                  input="${{ inputs.version }}"
                  if [[ ! "$input" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "ERROR: Invalid version='$input'"
                    echo "Expected format: v2.2.1 or 2.2.1"
                    exit 1
                  fi

                  clean="${input#v}"
                  tag="v${clean}"

                  IFS='.' read -r major minor patch <<< "$clean"

                  echo "clean=$clean" >> "$GITHUB_OUTPUT"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "major=$major" >> "$GITHUB_OUTPUT"
                  echo "minor=$minor" >> "$GITHUB_OUTPUT"
                  echo "patch=$patch" >> "$GITHUB_OUTPUT"

            - name: Ensure tag does not already exist
              shell: bash
              run: |
                  set -euo pipefail
                  tag="${{ steps.ver.outputs.tag }}"
                  if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                    echo "ERROR: Tag='$tag' already exists locally."
                    exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                    echo "ERROR: Tag='$tag' already exists on origin."
                    exit 1
                  fi

            - name: Update version files
              shell: bash
              run: |
                  set -euo pipefail
                  bash .github/scripts/update-version.sh \
                    "${{ steps.ver.outputs.major }}" \
                    "${{ steps.ver.outputs.minor }}" \
                    "${{ steps.ver.outputs.patch }}"

            - name: Detect and commit changes
              shell: bash
              run: |
                  set -euo pipefail

                  # List of version files to check for changes, must match script "update-version.sh"
                  files=(
                    "idf_component.yml"
                    "library.json"
                    "include/neopixel_version.h"
                  )

                  if git diff --quiet -- "${files[@]}"; then
                    echo "INFO: No version file changes detected; skipping commit."
                    # proceed with next step(s) in workflow
                    exit 0
                  fi

                  # Commit the file changes
                  echo "INFO: Committing version='${{ steps.ver.outputs.tag }}' changes to version files."
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add "${files[@]}"
                  git commit -m "chore: Set release='${{ steps.ver.outputs.tag }}' in version files"
                  git push origin HEAD

            - name: Create and push tag
              shell: bash
              run: |
                  set -euo pipefail
                  tag="${{ steps.ver.outputs.tag }}"
                  git tag "$tag"
                  git push origin "$tag"

            - name: Create GitHub Release page
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.ver.outputs.tag }}
                  name: Release ${{ steps.ver.outputs.tag }}
                  generate_release_notes: true
                  draft: false
                  prerelease: false
