name: Release Version

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version (e.g. v2.2.1)"
                required: true
                type: string

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Validate and parse version
              id: ver
              shell: bash
              run: |
                  set -euo pipefail

                  input="${{ inputs.version }}"
                  if [[ ! "$input" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Invalid version: $input"
                    echo "Expected format: v2.2.1 or 2.2.1"
                    exit 1
                  fi

                  clean="${input#v}"
                  tag="v${clean}"

                  IFS='.' read -r major minor patch <<< "$clean"

                  echo "clean=$clean" >> "$GITHUB_OUTPUT"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "major=$major" >> "$GITHUB_OUTPUT"
                  echo "minor=$minor" >> "$GITHUB_OUTPUT"
                  echo "patch=$patch" >> "$GITHUB_OUTPUT"

            - name: Ensure tag does not already exist
              shell: bash
              run: |
                  set -euo pipefail
                  tag="${{ steps.ver.outputs.tag }}"
                  if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                    echo "Tag $tag already exists locally."
                    exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                    echo "Tag $tag already exists on origin."
                    exit 1
                  fi

            - name: Update version files
              shell: bash
              run: |
                  set -euo pipefail
                  bash .github/scripts/update-version.sh \
                    "${{ steps.ver.outputs.major }}" \
                    "${{ steps.ver.outputs.minor }}" \
                    "${{ steps.ver.outputs.patch }}"

            - name: Detect changes
              id: changes
              shell: bash
              run: |
                  set -euo pipefail

                  files=(
                    "library.properties"
                    "library.json"
                    "include/neopixel_version.h"
                  )

                  changed=false
                  for f in "${files[@]}"; do
                    if ! git diff --quiet -- "$f"; then
                      changed=true
                      break
                    fi
                  done

                  echo "changed=$changed" >> "$GITHUB_OUTPUT"

                  if [[ "$changed" == "false" ]]; then
                    echo "No version file changes detected. Nothing to release."
                  fi

            - name: Commit changes
              if: steps.changes.outputs.changed == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add library.properties library.json include/neopixel_version.h
                  git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
                  git push origin HEAD

            - name: Create and push tag
              if: steps.changes.outputs.changed == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  tag="${{ steps.ver.outputs.tag }}"
                  git tag "$tag"
                  git push origin "$tag"

            - name: Create GitHub Release page
              if: steps.changes.outputs.changed == 'true'
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.ver.outputs.tag }}
                  name: Release ${{ steps.ver.outputs.tag }}
                  generate_release_notes: true
                  draft: false
                  prerelease: false

            - name: No-op summary
              if: steps.changes.outputs.changed != 'true'
              shell: bash
              run: |
                  echo "WARNING: Skipped commit/tag/release because version files did not change."
