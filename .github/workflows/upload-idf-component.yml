name: Publish ESP-IDF Component

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Component version (1.2.3, 1.2.3-rc1 or 1.2.3.4)"
                required: true
            git_ref:
                description: "Git ref with the source (branch, tag or commit). Leave empty to use tag."
                required: false

permissions:
    contents: read

jobs:
    upload_components:
        runs-on: ubuntu-latest
        steps:
            - name: Get the release tag
              id: tag
              env:
                  head_branch: ${{ inputs.tag }}
              run: |
                  # Read and sanitize the branch/tag name
                  branch=$(echo "$head_branch" | tr -cd '[:alnum:]/_.-')

                  if [[ $branch == refs/tags/* ]]; then
                    tag="${branch#refs/tags/}"
                  elif [[ $branch =~ ^[v]*[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
                    tag=$branch
                  else
                    echo "Tag not found in $branch. Exiting..."
                    exit 1
                  fi

                  echo "Tag: $tag"
                  echo "v=$tag" >> $GITHUB_OUTPUT

            - name: Resolve checkout ref
              id: ref
              env:
                  input_git_ref: ${{ inputs.git_ref }}
                  release_tag: ${{ steps.tag.outputs.v }}
              run: |
                  git_ref=$(echo "$input_git_ref" | tr -cd '[:alnum:]/_.-')

                  if [[ -z "$git_ref" ]]; then
                    git_ref=$release_tag
                  fi

                  echo "Checkout ref: $git_ref"
                  echo "v=$git_ref" >> $GITHUB_OUTPUT

            - uses: actions/checkout@v7
              with:
                  ref: ${{ steps.ref.outputs.v }}
                  submodules: "recursive"

            - name: Upload components to the component registry
              uses: espressif/upload-components-ci-action@v2
              with:
                  components: "neopixel:."
                  version: ${{ steps.tag.outputs.v }}
                  namespace: boskieft
                  api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
